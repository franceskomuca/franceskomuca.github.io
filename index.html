<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Francesko Muca | Cinematic Photography in Vlora</title>
  <style>
    :root {
      --primary: #1a1a1a;
      --text: #f8f8f8;
      --accent: #d4af37;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Montserrat', sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
      min-height: 100vh;
      padding: 0;
      overflow-x: hidden;
    }
    .hero {
      height: 100vh;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      padding-bottom: 3rem;
    }
    .hero-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.8;
      z-index: -1;
    }
    .bio {
      max-width: 600px;
      padding: 2rem;
      z-index: 10;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      border-radius: 10px;
      margin-bottom: 2rem;
    }
    .bio h1 {
      font-size: 3.5rem;
      line-height: 1.1;
      margin-bottom: 1rem;
      letter-spacing: 1px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    .bio p {
      font-size: 1.2rem;
      opacity: 0.9;
      line-height: 1.6;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 15px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }
    .gallery-item {
      aspect-ratio: 3/4;
      border-radius: 5px;
      overflow: hidden;
      cursor: pointer;
      transform: scale(1);
      transition: all 0.3s ease;
    }
    .gallery-item:hover {
      transform: scale(1.03);
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .cta {
      text-align: center;
      margin: 4rem 0 2rem;
    }
    .cta a {
      display: inline-block;
      background: var(--accent);
      color: var(--primary);
      padding: 1rem 2.5rem;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 1.1rem;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
    }
    .cta a:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(212, 175, 55, 0.5);
    }
  </style>
</head>
