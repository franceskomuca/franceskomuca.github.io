<head>

  <title>Cinematic Gallery | Francesko Muca</title>
  <style>
    /* Reused minimal CSS from homepage */
    body {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
      min-height: 100vh;
      padding: 5rem 0;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 2rem;
    }
    .gallery-item {
      aspect-ratio: 3/4;
      border-radius: 5px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
      background: #000;
    }
    .gallery-item:hover {
      transform: scale(1.02);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: all 0.5s ease;
    }
    .caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1rem;
      background: rgba(0,0,0,0.7);
      color: var(--text);
      font-size: 0.9rem;
      opacity: 0;
      transition: all 0.3s ease;
    }
    .gallery-item:hover .caption {
      opacity: 1;
      bottom: 5px;
      backdrop-filter: blur(5px);
    }
  </style>
</head>
